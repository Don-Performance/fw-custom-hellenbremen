	; Set by the firmware in boardConfigOverrides() (STM32 unique ID / OTP), never edited by the user
	readOnly = dpecmHardwareID
	readOnly = dpecmHardwareRev
	readOnly = dpecmOpenBltVersion
	readOnly = dpecmManufacturer
	readOnly = dpecmProgrammingDate

	; Set by the tool that writes the map, never edited by the user in TS
	;readOnly = dpecmLatestWriteId
	;readOnly = dpecmLatestWriteDate
	;readOnly = dpecmLatestWriteTypeId

	; Switches O2 sensing between analog/heater and CAN wideband, which is only applied at boot
	requiresPowerCycle = useWidebandSensor
